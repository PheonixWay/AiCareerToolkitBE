[project]
name = "aicareertoolkitbe"
version = "0.1.0"
description = "Backend Project for AI Career Tool kit"
readme = "README.md"
authors = [
    { name = "Danish Ansari", email = "danisha222002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
aicareertoolkitbe = "aicareertoolkitbe:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
